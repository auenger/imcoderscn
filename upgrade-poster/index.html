<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晋升通告海报</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    background: #f5f5f7; color: #1d1d1f; min-height: 100vh;
  }

  .app-header {
    background: #fff; border-bottom: 1px solid #e5e5e7;
    padding: 16px 32px; display: flex; align-items: center; gap: 12px;
  }
  .app-header h1 { font-size: 20px; font-weight: 700; }
  .app-header .logo-bars { display: flex; gap: 3px; align-items: flex-end; height: 20px; }
  .app-header .logo-bars span { width: 5px; border-radius: 2px; }
  .app-header .logo-bars span:nth-child(1) { height: 8px; background: linear-gradient(180deg, #ff6b9d, #c44dff); }
  .app-header .logo-bars span:nth-child(2) { height: 16px; background: linear-gradient(180deg, #6b8eff, #4dc4ff); }
  .app-header .logo-bars span:nth-child(3) { height: 12px; background: linear-gradient(180deg, #ff6b9d, #ff9d4d); }

  .app-body {
    display: flex; gap: 40px; padding: 32px;
    max-width: 1400px; margin: 0 auto; align-items: flex-start;
  }

  /* ===== Form ===== */
  .form-panel {
    flex: 1; min-width: 340px;
    max-height: calc(100vh - 120px); overflow-y: auto;
    padding-right: 8px; display: flex; flex-direction: column; gap: 14px;
  }
  .form-panel::-webkit-scrollbar { width: 6px; }
  .form-panel::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 3px; }

  .section-title {
    font-size: 13px; font-weight: 600; color: #6b5ce7;
    padding: 8px 0 2px; border-bottom: 1px solid #e5e5e7;
    margin-top: 4px;
  }

  .form-group label {
    display: block; font-size: 13px; font-weight: 500;
    color: #86868b; margin-bottom: 4px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid #d2d2d7; background: #fff; color: #1d1d1f;
    font-size: 14px; outline: none; font-family: inherit;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    border-color: #6b5ce7;
    box-shadow: 0 0 0 3px rgba(107,92,231,0.15);
  }
  .form-group textarea { resize: vertical; }
  .form-group .hint { font-size: 11px; color: #86868b; margin-top: 2px; }

  .range-row {
    display: flex; align-items: center; gap: 10px;
  }
  .range-row input[type="range"] { flex: 1; }
  .range-row .range-val {
    min-width: 42px; text-align: right;
    font-size: 13px; color: #86868b; font-variant-numeric: tabular-nums;
  }

  .inline-row {
    display: flex; gap: 12px;
  }
  .inline-row > div { flex: 1; }

  .download-btn {
    width: 100%; padding: 12px 24px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #6b5ce7, #a855f7);
    color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s; margin-top: 8px;
  }
  .download-btn:hover { opacity: 0.9; }
  .download-btn:disabled { background: #86868b; cursor: not-allowed; }

  /* ===== Preview ===== */
  .preview-panel { position: sticky; top: 32px; flex-shrink: 0; }
  .poster-wrapper {
    overflow: hidden; border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }

  #poster-canvas {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="logo-bars"><span></span><span></span><span></span></div>
  <h1>晋升通告海报</h1>
</div>

<div class="app-body">
  <div class="form-panel">

    <!-- 背景设置 -->
    <div class="section-title">背景</div>

    <div class="form-group">
      <label>背景图</label>
      <input type="file" accept="image/*" id="bgInput" onchange="handleBg(this)">
      <div class="hint">选择背景图（默认使用同目录下 bg.jpg）</div>
    </div>

    <div class="form-group">
      <label>遮罩透明度</label>
      <div class="range-row">
        <input type="range" id="overlayOpacity" min="0" max="80" value="0" oninput="updateVal(this);render()">
        <span class="range-val" id="overlayOpacity-val">0%</span>
      </div>
    </div>

    <!-- 字体设置 -->
    <div class="section-title">字体</div>

    <div class="form-group">
      <label>字体</label>
      <select id="fontFamily" onchange="render()">
        <option value="'Noto Sans SC', sans-serif">思源黑体 (Noto Sans SC)</option>
        <option value="'Noto Serif SC', serif">思源宋体 (Noto Serif SC)</option>
        <option value="'ZCOOL XiaoWei', serif">站酷小薇体</option>
        <option value="'Ma Shan Zheng', cursive">马善政楷体</option>
        <option value="'ZCOOL QingKe HuangYou', sans-serif">站酷庆科黄油体</option>
      </select>
    </div>

    <div class="form-group">
      <label>字体颜色</label>
      <input type="color" id="fontColor" value="#fef8ca" oninput="render()" style="height:36px;cursor:pointer;">
    </div>

    <!-- 内容排版 -->
    <div class="section-title">内容排版</div>

    <div class="form-group">
      <label>通告正文</label>
      <textarea id="content" rows="8" oninput="render()">经公司研究决定，自即日起：

xxx 同学晋升为 xxx 部门 xxx 职位。

xxx 同学在入职以来，工作认真负责，专业能力突出，为团队和公司的发展做出了重要贡献。此次晋升是对其工作成果的充分肯定，希望未来继续发挥优势，再创佳绩。</textarea>
    </div>

    <div class="form-group">
      <label>正文 / 特此通告 字号</label>
      <div class="range-row">
        <input type="range" id="fontSize" min="28" max="64" value="45" oninput="updateVal(this);render()">
        <span class="range-val" id="fontSize-val">45px</span>
      </div>
    </div>

    <div class="form-group">
      <label>内容区距顶部</label>
      <div class="range-row">
        <input type="range" id="contentTop" min="40" max="800" value="500" oninput="updateVal(this);render()">
        <span class="range-val" id="contentTop-val">500px</span>
      </div>
    </div>

    <div class="form-group">
      <label>"特此通告！"字号</label>
      <div class="range-row">
        <input type="range" id="footerSize" min="32" max="72" value="48" oninput="updateVal(this);render()">
        <span class="range-val" id="footerSize-val">48px</span>
      </div>
    </div>

    <div class="form-group">
      <label>"各位同事"字号</label>
      <div class="range-row">
        <input type="range" id="greetingSize" min="32" max="72" value="48" oninput="updateVal(this);render()">
        <span class="range-val" id="greetingSize-val">48px</span>
      </div>
    </div>

    <!-- 落款 -->
    <div class="section-title">落款（右下角）</div>

    <div class="form-group">
      <label>距底部距离</label>
      <div class="range-row">
        <input type="range" id="signBottom" min="30" max="600" value="198" oninput="updateVal(this);render()">
        <span class="range-val" id="signBottom-val">198px</span>
      </div>
    </div>

    <div class="form-group">
      <label>公司名 / 日期字号</label>
      <div class="range-row">
        <input type="range" id="signSize" min="24" max="80" value="54" oninput="updateVal(this);render()">
        <span class="range-val" id="signSize-val">54px</span>
      </div>
    </div>

    <div class="inline-row">
      <div class="form-group">
        <label>年</label>
        <input type="text" id="year" value="2026" oninput="render()">
      </div>
      <div class="form-group">
        <label>月</label>
        <input type="text" id="month" value="04" oninput="render()">
      </div>
    </div>

    <button class="download-btn" id="downloadBtn" onclick="downloadPoster()">下载海报 PNG</button>
  </div>

  <!-- Preview -->
  <div class="preview-panel">
    <div class="poster-wrapper" id="poster-wrapper">
      <div id="poster-canvas"></div>
    </div>
  </div>
</div>

let bgUrl = DEFAULT_BG;

function updateVal(el) {
  const span = document.getElementById(el.id + '-val');
  if (!span) return;
  const unit = el.id === 'overlayOpacity' ? '%' : 'px';
  span.textContent = el.value + unit;
}

window.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('input[type="range"]').forEach(el => updateVal(el));
  render();
});

function handleBg(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { bgUrl = e.target.result; render(); };
  reader.readAsDataURL(file);
}

function render() {
  const canvas = document.getElementById('poster-canvas');
  const wrapper = document.getElementById('poster-wrapper');

  const fontColor = document.getElementById('fontColor').value;
  const fontFamily = document.getElementById('fontFamily').value;
  const fontSize = document.getElementById('fontSize').value;
  const contentTop = document.getElementById('contentTop').value;
  const footerSize = document.getElementById('footerSize').value;
  const greetingSize = document.getElementById('greetingSize').value;
  const signBottom = document.getElementById('signBottom').value;
  const signSize = document.getElementById('signSize').value;
  const opacity = document.getElementById('overlayOpacity').value / 100;
  const content = document.getElementById('content').value;
  const year = document.getElementById('year').value;
  const month = document.getElementById('month').value;

  wrapper.style.width = (POSTER_W * SCALE) + 'px';
  wrapper.style.height = (POSTER_H * SCALE) + 'px';

  canvas.style.width = POSTER_W + 'px';
  canvas.style.height = POSTER_H + 'px';
  canvas.style.transform = `scale(${SCALE})`;
  canvas.style.transformOrigin = 'top left';
  canvas.style.fontFamily = fontFamily;

  const escaped = content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const paragraphs = escaped.split(/\n/).map(line =>
    line.trim()
      ? `<p style="text-indent:2em;text-align:justify;margin:0 0 0.6em 0;">${line}</p>`
      : ''
  ).join('');

  const bgHtml = bgUrl
    ? `<img src="${bgUrl}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">`
    : '';

  canvas.innerHTML = `
    ${bgHtml}
    <div style="position:absolute;inset:0;background:rgba(255,255,255,${opacity});"></div>

    <div style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;padding:${contentTop}px 90px 80px;font-family:${fontFamily};">
      <div style="font-size:${greetingSize}px;font-weight:600;color:${fontColor};margin-bottom:48px;text-align:left;">各位同事：</div>
      <div style="font-size:${fontSize}px;line-height:1.9;color:${fontColor};">${paragraphs}</div>
      <div style="font-size:${footerSize}px;font-weight:600;color:${fontColor};text-align:left;margin-top:48px;">特此通告！</div>
    </div>

    <div style="position:absolute;bottom:${signBottom}px;right:90px;display:flex;flex-direction:column;align-items:flex-end;gap:12px;font-family:${fontFamily};">
      <div style="font-size:${signSize}px;font-weight:700;color:${fontColor};">领视科技</div>
      <div style="font-size:${signSize * 0.82}px;color:${fontColor};">${year}年 ${month}月</div>
    </div>
  `;
}

async function downloadPoster() {
  const btn = document.getElementById('downloadBtn');
  const canvas = document.getElementById('poster-canvas');
  const wrapper = document.getElementById('poster-wrapper');

  btn.disabled = true;
  btn.textContent = '生成中...';

  const origW = wrapper.style.width;
  const origH = wrapper.style.height;
  const origTransform = canvas.style.transform;

  wrapper.style.width = POSTER_W + 'px';
  wrapper.style.height = POSTER_H + 'px';
  canvas.style.transform = 'none';

  try {
    const result = await html2canvas(canvas, {
      width: POSTER_W, height: POSTER_H, scale: 2,
      useCORS: true, backgroundColor: null
    });
    const link = document.createElement('a');
    link.download = '晋升通告.png';
    link.href = result.toDataURL('image/png');
    link.click();
  } catch (err) {
    console.error('Failed:', err);
    alert('生成失败，请重试');
  } finally {
    wrapper.style.width = origW;
    wrapper.style.height = origH;
    canvas.style.transform = origTransform;
    btn.disabled = false;
    btn.textContent = '下载海报 PNG';
  }
}
</script>
